name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on VPS runner
    runs-on: [self-hosted, linux, eventshare-vps]
    # Only deploy when CI passed (workflow_dispatch bypasses this gate intentionally)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Validate server app path
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VPS_APP_DIR }}" ]; then
            echo "Missing secret VPS_APP_DIR"
            exit 1
          fi
          if [ ! -d "${{ secrets.VPS_APP_DIR }}" ]; then
            echo "VPS_APP_DIR does not exist: ${{ secrets.VPS_APP_DIR }}"
            exit 1
          fi

      - name: Deploy locally on server
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ secrets.VPS_APP_DIR }}"
          bash scripts/deploy-prod.sh
