name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on tunneled vps01 runner
    # The runner must be installed on vps01, not the legacy IONOS host.
    runs-on: [self-hosted, linux, eventshare-vps01]
    # Only deploy when CI passed (workflow_dispatch bypasses this gate intentionally)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Validate server app path
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${VPS_APP_DIR:-$HOME/apps/eventshare}"
          if [ ! -d "${APP_DIR}" ]; then
            echo "Deploy directory does not exist: ${APP_DIR}"
            exit 1
          fi
          echo "APP_DIR=${APP_DIR}" >> "$GITHUB_ENV"

      - name: Deploy locally on server
        shell: bash
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          bash scripts/deploy-prod.sh
